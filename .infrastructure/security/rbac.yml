apiVersion: v1
kind: ServiceAccount
metadata:
  name: todoapp-sa
  namespace: mateapp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: mateapp
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-secrets-binding
  namespace: mateapp
subjects:
- kind: ServiceAccount
  name: todoapp-sa
  namespace: mateapp
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io